services:
  db:
    image: mariadb:11.8.6
    command: ["--max-allowed-packet=64M"]
    environment:
      MARIADB_DATABASE: ingestion
      MARIADB_USER: ingestion
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-local_ingestion}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-local_root_only}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  nats-init:
    image: nats:2.12.5-alpine
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:1000 /data"]
    volumes:
      - nats_data:/data
    restart: "no"
  nats:
    depends_on:
      nats-init:
        condition: service_completed_successfully
    image: nats:2.12.5-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    user: "1000:1000"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  ingestion:
    <<: *app
    ports:
      - "127.0.0.1:${INGESTION_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  nats-test:
    profiles: [test]
    image: nats:2.12.5-alpine
    user: "1000:1000"
    command: ["-js", "-sd", "/tmp/jetstream-test", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 15
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
      target: test
    environment:
      <<: *environment
      TEST_DATABASE_URL: mysql+pymysql://ingestion:${MARIADB_PASSWORD:-local_ingestion}@db:3306/ingestion_test?charset=utf8mb4
      TEST_NATS_URL: nats://nats-test:4222
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats-test:
        condition: service_healthy

  enrichment-bootstrap:
    <<: *enrichment
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-local_root_only}
      ENRICHMENT_DB_PASSWORD: ${ENRICHMENT_DB_PASSWORD:-local_enrichment}
    command: ["python", "-m", "app.storage.bootstrap"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  enrichment-migrate:
    <<: *enrichment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      enrichment-bootstrap:
        condition: service_completed_successfully
    restart: "no"
  enrichment:
    <<: *enrichment
    ports:
      - "127.0.0.1:${ENRICHMENT_PORT:-8001}:8001"
    depends_on:
      enrichment-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  enrichment-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: services/enrichment/Dockerfile
      target: test
    environment:
      <<: *enrichment-environment
      TEST_DATABASE_URL: mysql+pymysql://enrichment:${ENRICHMENT_DB_PASSWORD:-local_enrichment}@db:3306/enrichment_test?charset=utf8mb4
      TEST_NATS_URL: nats://nats-test:4222
    depends_on:
      enrichment-migrate:
        condition: service_completed_successfully
      nats-test:
        condition: service_healthy

  events-bootstrap:
    <<: *events
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-local_root_only}
      EVENTS_DB_PASSWORD: ${EVENTS_DB_PASSWORD:-local_events}
    command: ["python", "-m", "app.storage.bootstrap"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  events-migrate:
    <<: *events
